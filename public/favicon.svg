<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Dark navy/black background -->
  <rect width="256" height="256" fill="#0a0e27" rx="32"/>

  <!-- Subtle gradient overlay for depth -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e27;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Yellow PS monogram text -->
  <text x="128" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Roboto', sans-serif" font-size="140" font-weight="800" text-anchor="middle" fill="#ffb700" letter-spacing="-8">
    PS
  </text>
</svg>
